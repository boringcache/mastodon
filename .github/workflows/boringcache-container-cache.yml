name: Container cache comparison

on:
  push:
    branches:
      - boringcache-onboarding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  upstream-no-cache:
    name: Upstream cache:false / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build with upstream cache:false behavior
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: mastodon-upstream-no-cache:test
          load: false
          push: false
          provenance: false
          build-args: |
            MASTODON_VERSION_PRERELEASE=boringcache
            MASTODON_VERSION_METADATA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}

  github-actions-cache:
    name: GitHub Actions cache / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build with GitHub Actions cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: mastodon-gha-cache:test
          load: false
          push: false
          provenance: false
          build-args: |
            MASTODON_VERSION_PRERELEASE=boringcache
            MASTODON_VERSION_METADATA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=build-${{ hashFiles('Dockerfile') }}-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=build-${{ hashFiles('Dockerfile') }}-${{ matrix.platform_pair }}

  boringcache-layer:
    name: BoringCache layer / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build with BoringCache layer cache
        id: cache
        uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1.19.1
        with:
          cli-version: v1.19.1
          trust-policy: auto
          setup: none
          mode: docker
          working-directory: .github/boringcache/layer
          context: ../../..
          dockerfile: Dockerfile
          image: mastodon-boringcache-layer
          tags: test
          platforms: ${{ matrix.platform }}
          load: false
          push: false
          provenance: false
          build-args: |
            MASTODON_VERSION_PRERELEASE=boringcache
            MASTODON_VERSION_METADATA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
          diagnostics: summary
          verify: wait
          fail-on-cache-error: true
          metadata-hints: lane=layer,upstream=mastodon
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

  boringcache-layer-ccache-mount:
    name: BoringCache layer + ccache + mountcache / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build with BoringCache layer, ccache, and mountcache
        id: cache
        uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1.19.1
        with:
          cli-version: v1.19.1
          trust-policy: auto
          setup: none
          mode: docker
          context: .
          dockerfile: Dockerfile
          image: mastodon-boringcache-layer-ccache-mount
          tags: test
          platforms: ${{ matrix.platform }}
          load: false
          push: false
          provenance: false
          build-args: |
            MASTODON_VERSION_PRERELEASE=boringcache
            MASTODON_VERSION_METADATA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
          docker-tool-cache: ccache
          docker-mount-cache: true
          diagnostics: summary
          verify: wait
          fail-on-cache-error: true
          metadata-hints: lane=layer-ccache-mount,upstream=mastodon
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

  boringcache-no-layer-ccache-mount:
    name: BoringCache no layer + ccache + mountcache / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build with BoringCache ccache and mountcache without layer reuse
        id: cache
        uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1.19.1
        with:
          cli-version: v1.19.1
          trust-policy: auto
          setup: none
          mode: docker
          working-directory: .github/boringcache/no-layer-ccache-mount
          context: ../../..
          dockerfile: Dockerfile
          image: mastodon-boringcache-no-layer-ccache-mount
          tags: test
          platforms: ${{ matrix.platform }}
          load: false
          push: false
          no-cache: true
          provenance: false
          build-args: |
            MASTODON_VERSION_PRERELEASE=boringcache
            MASTODON_VERSION_METADATA=${{ github.sha }}
            SOURCE_COMMIT=${{ github.sha }}
          docker-tool-cache: ccache
          docker-mount-cache: true
          diagnostics: summary
          verify: wait
          fail-on-cache-error: true
          metadata-hints: lane=no-layer-ccache-mount,upstream=mastodon
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}
